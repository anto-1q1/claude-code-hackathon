version: "3.9"

# Local stand-ins mirror cloud primitives:
#   postgres  → RDS PostgreSQL Multi-AZ
#   redis     → ElastiCache Redis
#   minio     → S3

services:

  # ── Backing services ────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: contoso
      POSTGRES_USER: contoso_app
      POSTGRES_PASSWORD: local_dev_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./workloads/reporting-db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contoso_app -d contoso"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "9000:9000"
      - "9001:9001"

  # ── Workloads ────────────────────────────────────────────────────────────────

  webapp:
    build:
      context: ./workloads/webapp
      dockerfile: Dockerfile
    environment:
      ENV: local
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: contoso
      DB_USER: contoso_app
      DB_PASSWORD: local_dev_only
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: contoso-reports
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5000:5000"

  batch:
    build:
      context: ./workloads/batch
      dockerfile: Dockerfile
    environment:
      ENV: local
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: contoso
      DB_USER: contoso_app
      DB_PASSWORD: local_dev_only
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: contoso-reconciled
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      RUN_DATE: ""  # override with: docker compose run -e RUN_DATE=2026-04-28 batch
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    profiles:
      - batch  # run manually: docker compose --profile batch up batch

volumes:
  postgres_data:
  minio_data:
